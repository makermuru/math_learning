<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef6f4">
  <meta name="description" content="Jane's Math Lab: an interactive Ontario Grade 3 maths practice app that works offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Math Lab">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <title>Jane’s Math Lab</title>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/">🧪 Jane’s Math Lab</a>
    <div class="header-actions">
      <span class="pill">Grade 3 · Ontario</span>
      <button id="themeBtn" class="theme-btn" type="button">🌓 Auto</button>
      <a class="icon-btn settings-link" href="#/settings" aria-label="Settings">⚙️</a>
    </div>
  </header>
  <main id="app" class="wrap">
    <noscript><p class="card">Please turn on JavaScript to use Jane’s Math Lab.</p></noscript>
  </main>
  <script src="js/content.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
